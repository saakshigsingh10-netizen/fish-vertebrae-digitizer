<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VertebraDigitizer - Dynamic Raw Radiograph Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    :root {
      --v1-color: #3b82f6;     /* V1 Atlas (Blue Box) */
      --pre-color: #ef4444;    /* Precaudal P1+ (Red) */
      --cau-color: #06b6d4;    /* Caudal C1+ (Cyan) */
      --w-color: #a855f7;      /* Weberian (if present) */
      --bg-dark: #07090e;
      --panel-bg: rgba(13, 17, 25, 0.96);
      --border-color: rgba(255, 255, 255, 0.12);
    }
    body {
      background: var(--bg-dark);
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      margin: 0;
    }
    .app-header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }
    .main-container {
      display: flex;
      height: calc(100vh - 56px);
      position: relative;
    }
    .sidebar {
      width: 440px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 10;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .canvas-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #020305;
      user-select: none;
    }
    .canvas-wrapper.mode-draw { cursor: crosshair; }
    .canvas-wrapper.mode-pan { cursor: grab; }
    .canvas-wrapper.mode-pan:active { cursor: grabbing; }
    #imageCanvas { position: absolute; top: 0; left: 0; }
    
    .ai-dock {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      box-shadow: 0 12px 40px rgba(0,0,0,.85);
      border-radius: 16px;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      z-index: 20;
    }
    .counter-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 65px;
    }
    .counter-badge .val { font-size: 1.35rem; font-weight: 700; line-height: 1; }
