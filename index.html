<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Fish Vertebral Digitizer & Intensity AI Peak Detector</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    :root {
      --precaudal-color: #ff4d4d;
      --caudal-color: #00f2fe;
      --bg-dark: #0f1117;
      --panel-bg: rgba(20, 24, 33, 0.95);
      --border-color: rgba(255, 255, 255, 0.12);
    }

    body {
      background-color: var(--bg-dark);
      color: #e2e8f0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      margin: 0;
    }

    .app-header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(12px);
      z-index: 100;
    }

    .main-container {
      display: flex;
      height: calc(100vh - 56px);
      position: relative;
    }

    .sidebar {
      width: 340px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(12px);
      z-index: 10;
      overflow-y: auto;
    }

    .canvas-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #05070a;
      user-select: none;
    }

    .canvas-wrapper.mode-draw { cursor: crosshair; }
    .canvas-wrapper.mode-pan { cursor: grab; }
    .canvas-wrapper.mode-pan:active { cursor: grabbing; }

    #imageCanvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    .ai-dock {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      border-radius: 16px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 24px;
      backdrop-filter: blur(16px);
      z-index: 20;
    }

    .counter-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 75px;
    }

    .counter-badge .val {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1;
    }

    .counter-badge .lbl {
      font-size: 0.7rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    .val-pre { color: var(--precaudal-color); }
    .val-cau { color: var(--caudal-color); }
    .val-total { color: #38bdf8; }

    .btn-mode {
      border: 2px solid transparent;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-mode.active-pre {
      background: rgba(255, 77, 77, 0.2);
      border-color: var(--precaudal-color);
      color: #fff;
    }

    .btn-mode.active-cau {
      background: rgba(0, 242, 254, 0.2);
      border-color: var(--caudal-color);
      color: #fff;
    }

    .floating-controls {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 20;
    }

    .floating-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }

    .floating-btn:hover {
      background: rgba(255,255,255,0.15);
      color: #38bdf8;
    }

    .floating-btn.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
    }

    .banner-instruction {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(245, 158, 11, 0.95);
      color: #000;
      font-weight: 700;
      padding: 8px 20px;
      border-radius: 20px;
      z-index: 30;
      display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-cpu-fill text-info fs-4"></i>
      <h5 class="m-0 fw-bold">VertebraDigitizer <span class="badge bg-success fs-6 ms-2">Real AI Dynamics</span></h5>
    </div>
    <div class="d-flex gap-2 align-items-center">
      <label class="btn btn-sm btn-primary mb-0">
        <i class="bi bi-upload me-1"></i> Upload Custom X-Ray Image
        <input type="file" id="imageInput" accept="image/*" hidden onchange="handleImageUpload(event)">
      </label>
    </div>
  </header>

  <div class="main-container">
    <div class="sidebar p-3">
      <h6 class="text-uppercase text-muted fw-bold fs-7 mb-2"><i class="bi bi-sliders me-1"></i> AI Peak Sensitivity</h6>
      
      <div class="mb-3">
        <label class="form-label small mb-1">Axial Node Spacing Sensitivity: <span id="sensitivityVal">22px</span></label>
        <input type="range" class="form-range" id="sensitivitySlider" min="10" max="45" value="22" oninput="document.getElementById('sensitivityVal').innerText=this.value+'px'">
      </div>

      <div class="mb-3">
        <label class="form-label small mb-1">Target Total Vertebrae Count Override</label>
        <div class="input-group input-group-sm">
          <span class="input-group-text bg-dark text-light border-secondary">Nodes</span>
          <input type="number" id="targetTotalCount" class="form-control bg-dark text-light border-secondary" value="29">
        </div>
        <div class="form-text text-muted" style="font-size: 0.7rem;">Leave empty for fully unconstrained pixel peak detection.</div>
      </div>

      <hr class="border-secondary my-2">

      <h6 class="text-uppercase text-muted fw-bold fs-7 mb-2"><i class="bi bi-hand-index-thumb me-1"></i> Mode & Tools</h6>
      <div class="btn-group w-100 mb-2" role="group">
        <button id="toolDrawBtn" class="btn btn-sm btn-outline-primary active" onclick="setTool('draw')"><i class="bi bi-geo-fill me-1"></i> Edit Points</button>
        <button id="toolPanBtn" class="btn btn-sm btn-outline-primary" onclick="setTool('pan')"><i class="bi bi-arrows-move me-1"></i> Pan Canvas</button>
      </div>

      <h6 class="text-uppercase text-muted fw-bold fs-7 mb-2 mt-3"><i class="bi bi-palette me-1"></i> Manual Marker Type</h6>
      <div class="d-grid gap-2 mb-3">
        <button id="btnPrecaudal" class="btn btn-mode active-pre text-start d-flex justify-content-between align-items-center" onclick="setMode('precaudal')">
          <span><i class="bi bi-record-circle-fill text-danger me-2"></i> Precaudal (Key 1)</span>
          <span id="sideCountPre" class="badge bg-danger rounded-pill">0</span>
        </button>
        <button id="btnCaudal" class="btn btn-mode text-start d-flex justify-content-between align-items-center" onclick="setMode('caudal')">
          <span><i class="bi bi-record-circle-fill text-info me-2"></i> Caudal (Key 2)</span>
          <span id="sideCountCau" class="badge bg-info rounded-pill">0</span>
        </button>
      </div>

      <hr class="border-secondary my-2">

      <h6 class="text-uppercase text-muted fw-bold fs-7 mb-2"><i class="bi bi-download me-1"></i> Actions & Exports</h6>
      <div class="d-grid gap-2">
        <button class="btn btn-success btn-sm text-start" onclick="exportCSV()"><i class="bi bi-filetype-csv me-2"></i> Export Landmark CSV</button>
        <button class="btn btn-outline-light btn-sm text-start" onclick="exportPNG()"><i class="bi bi-file-earmark-image me-2 text-warning"></i> Export High-Res PNG</button>
        <button class="btn btn-outline-danger btn-sm text-start" onclick="clearAll()"><i class="bi bi-trash me-2"></i> Clear Points</button>
      </div>
    </div>

    <div class="canvas-wrapper mode-draw" id="canvasWrapper">
      <div id="bannerInstruction" class="banner-instruction">Click 1: Head/Anterior End | Click 2: Tail/Posterior End</div>
      <canvas id="imageCanvas"></canvas>

      <div class="floating-controls">
        <button id="btnPanToggle" class="floating-btn" onclick="setTool(activeTool === 'pan' ? 'draw' : 'pan')" title="Toggle Pan Tool"><i class="bi bi-hand-index-thumb"></i></button>
        <button class="floating-btn" onclick="zoomIn()"><i class="bi bi-zoom-in"></i></button>
        <button class="floating-btn" onclick="zoomOut()"><i class="bi bi-zoom-out"></i></button>
        <button class="floating-btn" onclick="resetView()"><i class="bi bi-arrows-angle-contract"></i></button>
      </div>

      <div class="ai-dock">
        <div class="counter-badge">
          <span class="val val-pre" id="dockPreCount">0</span>
          <span class="lbl">Precaudal</span>
        </div>
        <div class="counter-badge">
          <span class="val val-cau" id="dockCauCount">0</span>
          <span class="lbl">Caudal</span>
        </div>
        <div class="counter-badge">
          <span class="val val-total" id="dockTotalCount">0</span>
          <span class="lbl">Total Detected</span>
        </div>

        <div class="d-flex gap-2">
          <button class="btn btn-info text-dark fw-bold" onclick="startSpinePlacement()"><i class="bi bi-magic me-1"></i> Scan Spine Path (Intensity AI)</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvasWrapper');

    let currentImage = null;
    let mode = 'precaudal';
    let points = [];

    let activeTool = 'draw';
    let scale = 1;
    let panX = 0;
    let panY = 0;
    let isPanning = false;
    let startPanX = 0;
    let startPanY = 0;

    let draggingPoint = null;
    let placementStep = 0;
    let lineStart = null;

    function setTool(tool) {
      activeTool = tool;
      document.getElementById('toolDrawBtn').className = `btn btn-sm btn-outline-primary ${tool === 'draw' ? 'active' : ''}`;
      document.getElementById('toolPanBtn').className = `btn btn-sm btn-outline-primary ${tool === 'pan' ? 'active' : ''}`;
      document.getElementById('btnPanToggle').className = `floating-btn ${tool === 'pan' ? 'active' : ''}`;
      wrapper.className = tool === 'pan' ? 'canvas-wrapper mode-pan' : 'canvas-wrapper mode-draw';
    }

    function setMode(newMode) {
      mode = newMode;
      document.getElementById('btnPrecaudal').className = `btn btn-mode ${mode==='precaudal'?'active-pre':''} text-start d-flex justify-content-between align-items-center`;
      document.getElementById('btnCaudal').className = `btn btn-mode ${mode==='caudal'?'active-cau':''} text-start d-flex justify-content-between align-items-center`;
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          currentImage = img;
          points = [];
          resetView();
          updateCounts();
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function startSpinePlacement() {
      if (!currentImage) return alert('Please upload an X-ray image first.');
      setTool('draw');
      placementStep = 1;
      const banner = document.getElementById('bannerInstruction');
      banner.style.display = 'block';
    }

    function executeIntensityPeakDetection(startPt, endPt) {
      const canvasOff = document.createElement('canvas');
      canvasOff.width = currentImage.width;
      canvasOff.height = currentImage.height;
      const octx = canvasOff.getContext('2d');
      octx.drawImage(currentImage, 0, 0);
      const imgData = octx.getImageData(0, 0, currentImage.width, currentImage.height);

      const dx = endPt.x - startPt.x;
      const dy = endPt.y - startPt.y;
      const length = Math.hypot(dx, dy);
      const steps = Math.floor(length);

      const profile = [];
      for (let s = 0; s <= steps; s++) {
        const t = s / steps;
        const px = Math.round(startPt.x + t * dx);
        const py = Math.round(startPt.y + t * dy);

        if (px >= 0 && px < currentImage.width && py >= 0 && py < currentImage.height) {
          const idx = (py * currentImage.width + px) * 4;
          const r = imgData.data[idx];
          const g = imgData.data[idx + 1];
          const b = imgData.data[idx + 2];
          const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
          profile.push({ x: px, y: py, luminance, dist: t });
        }
      }

      const windowSize = parseInt(document.getElementById('sensitivitySlider').value);
      const detectedPeaks = [];

      for (let i = windowSize; i < profile.length - windowSize; i++) {
        let isLocalMax = true;
        for (let w = -windowSize; w <= windowSize; w++) {
          if (w !== 0 && profile[i + w].luminance > profile[i].luminance) {
            isLocalMax = false;
            break;
          }
        }
        if (isLocalMax) {
          detectedPeaks.push(profile[i]);
          i += Math.floor(windowSize / 2);
        }
      }

      points = [];
      const userTargetCount = parseInt(document.getElementById('targetTotalCount').value);

      if (userTargetCount && !isNaN(userTargetCount) && userTargetCount > 0) {
        // Resample along spine based on user requested target count
        for (let k = 0; k < userTargetCount; k++) {
          const t = k / (userTargetCount - 1);
          const px = startPt.x + t * dx;
          const py = startPt.y + t * dy;
          
          // Split roughly based on 45% precaudal anatomical boundary
          const isPrecaudal = t <= 0.45;
          points.push({ x: px, y: py, type: isPrecaudal ? 'precaudal' : 'caudal' });
        }
      } else {
        // Direct pixel intensity profile peaks
        detectedPeaks.forEach((pk) => {
          const isPrecaudal = pk.dist <= 0.45;
          points.push({ x: pk.x, y: pk.y, type: isPrecaudal ? 'precaudal' : 'caudal' });
        });
      }

      updateCounts();
      render();
    }

    function render() {
      if (!currentImage) return;

      canvas.width = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;

      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.translate(panX, panY);
      ctx.scale(scale, scale);

      ctx.drawImage(currentImage, 0, 0);

      let preIdx = 1;
      let cauIdx = 1;

      points.forEach((pt, index) => {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 6 / scale, 0, Math.PI * 2);

        if (pt.type === 'precaudal') {
          ctx.fillStyle = '#ff4d4d';
          ctx.strokeStyle = '#ffffff';
        } else {
          ctx.fillStyle = '#00f2fe';
          ctx.strokeStyle = '#ffffff';
        }

        ctx.lineWidth = 2 / scale;
        ctx.fill();
        ctx.stroke();

        if (index === 0) {
          ctx.strokeStyle = '#00ff66';
          ctx.lineWidth = 2 / scale;
          ctx.strokeRect(pt.x - 8 / scale, pt.y - 8 / scale, 16 / scale, 16 / scale);
        }

        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${Math.max(10, 12 / scale)}px sans-serif`;
        const labelText = pt.type === 'precaudal' ? `P${preIdx++}` : `C${cauIdx++}`;
        ctx.fillText(labelText, pt.x + (8 / scale), pt.y - (8 / scale));
      });

      ctx.restore();
    }

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left - panX) / scale,
        y: (e.clientY - rect.top - panY) / scale
      };
    }

    wrapper.addEventListener('mousedown', (e) => {
      const coords = getCanvasCoords(e);
      if (activeTool === 'pan' || e.button === 1) {
        isPanning = true;
        startPanX = e.clientX - panX;
        startPanY = e.clientY - startPanY;
        return;
      }

      const hitRadius = 12 / scale;
      const hitIndex = points.findIndex(pt => Math.hypot(pt.x - coords.x, pt.y - coords.y) < hitRadius);
      if (hitIndex !== -1) {
        draggingPoint = hitIndex;
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isPanning) {
        panX = e.clientX - startPanX;
        panY = e.clientY - startPanY;
        render();
        return;
      }

      if (draggingPoint !== null) {
        const coords = getCanvasCoords(e);
        points[draggingPoint].x = coords.x;
        points[draggingPoint].y = coords.y;
        render();
      }
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
      draggingPoint = null;
    });

    wrapper.addEventListener('click', (e) => {
      if (activeTool === 'pan' || !currentImage || draggingPoint !== null) return;

      const coords = getCanvasCoords(e);

      if (placementStep === 1) {
        lineStart = coords;
        placementStep = 2;
        return;
      }

      if (placementStep === 2) {
        const lineEnd = coords;
        placementStep = 0;
        document.getElementById('bannerInstruction').style.display = 'none';
        executeIntensityPeakDetection(lineStart, lineEnd);
        return;
      }

      points.push({ x: coords.x, y: coords.y, type: mode });
      updateCounts();
      render();
    });

    wrapper.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
      scale = Math.min(Math.max(0.1, scale * zoomFactor), 20);
      render();
    }, { passive: false });

    function resetView() {
      if (!currentImage) return;
      scale = Math.min(wrapper.clientWidth / currentImage.width, wrapper.clientHeight / currentImage.height) * 0.9;
      panX = (wrapper.clientWidth - currentImage.width * scale) / 2;
      panY = (wrapper.clientHeight - currentImage.height * scale) / 2;
      render();
    }

    function zoomIn() { scale *= 1.2; render(); }
    function zoomOut() { scale *= 0.8; render(); }

    function updateCounts() {
      const preCount = points.filter(p => p.type === 'precaudal').length;
      const cauCount = points.filter(p => p.type === 'caudal').length;

      document.getElementById('sideCountPre').innerText = preCount;
      document.getElementById('sideCountCau').innerText = cauCount;
      document.getElementById('dockPreCount').innerText = preCount;
      document.getElementById('dockCauCount').innerText = cauCount;
      document.getElementById('dockTotalCount').innerText = preCount + cauCount;
    }

    function clearAll() {
      points = [];
      updateCounts();
      render();
    }

    function exportCSV() {
      let csv = 'LANDMARK_INDEX,TYPE,X_PIXEL,Y_PIXEL\n';
      points.forEach((pt, idx) => {
        csv += `${idx + 1},${pt.type},${pt.x.toFixed(2)},${pt.y.toFixed(2)}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `landmarks.csv`;
      a.click();
    }

    function exportPNG() {
      if (!currentImage) return;
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = currentImage.width;
      exportCanvas.height = currentImage.height;
      const ectx = exportCanvas.getContext('2d');

      ectx.drawImage(currentImage, 0, 0);
      points.forEach((pt, idx) => {
        ectx.beginPath();
        ectx.arc(pt.x, pt.y, 8, 0, Math.PI * 2);
        ectx.fillStyle = pt.type === 'precaudal' ? '#ff4d4d' : '#00f2fe';
        ectx.fill();
      });

      const a = document.createElement('a');
      a.href = exportCanvas.toDataURL('image/png');
      a.download = `annotated_xray.png`;
      a.click();
    }
  </script>
</body>
</html>
