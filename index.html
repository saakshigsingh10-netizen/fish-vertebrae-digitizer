<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertebral Digitizer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    :root {
      --precaudal-color: #ff4d4d;
      --caudal-color: #00f2fe;
      --bg-dark: #121216;
      --panel-bg: rgba(22, 22, 30, 0.95);
      --border-color: rgba(255, 255, 255, 0.1);
    }

    body {
      background-color: var(--bg-dark);
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      margin: 0;
    }

    .app-header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 20px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    .main-container {
      display: flex;
      height: calc(100vh - 56px);
      position: relative;
    }

    .sidebar {
      width: 320px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(10px);
      z-index: 10;
      overflow-y: auto;
    }

    .canvas-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #08080a;
      cursor: crosshair;
    }

    .canvas-wrapper.panning {
      cursor: grab;
    }
    .canvas-wrapper.panning:active {
      cursor: grabbing;
    }

    #imageCanvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    .ai-dock {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      border-radius: 16px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 24px;
      backdrop-filter: blur(16px);
      z-index: 20;
    }

    .counter-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 80px;
    }

    .counter-badge .val {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1;
    }

    .counter-badge .lbl {
      font-size: 0.75rem;
      color: #a0a0ab;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    .val-pre { color: var(--precaudal-color); }
    .val-cau { color: var(--caudal-color); }
    .val-total { color: #4facfe; }

    .btn-mode {
      border: 2px solid transparent;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-mode.active-pre {
      background: rgba(255, 77, 77, 0.2);
      border-color: var(--precaudal-color);
      color: #fff;
    }

    .btn-mode.active-cau {
      background: rgba(0, 242, 254, 0.2);
      border-color: var(--caudal-color);
      color: #fff;
    }

    .floating-controls {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 20;
    }

    .floating-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }

    .floating-btn:hover {
      background: rgba(255,255,255,0.1);
      color: #4facfe;
    }

    .banner-instruction {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 193, 7, 0.9);
      color: #000;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 20px;
      z-index: 30;
      display: none;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-diagram-3-fill text-primary fs-4"></i>
      <h5 class="m-0 fw-bold">VertebraDigitizer <span class="badge bg-primary fs-6 ms-2">v3.1</span></h5>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-outline-light" onclick="loadSampleImage()"><i class="bi bi-image me-1"></i> Sample</button>
      <label class="btn btn-sm btn-primary mb-0">
        <i class="bi bi-upload me-1"></i> Upload X-Ray
        <input type="file" id="imageInput" accept="image/*" hidden onchange="handleImageUpload(event)">
      </label>
    </div>
  </header>

  <div class="main-container">
    <div class="sidebar p-3">
      <h6 class="text-uppercase text-muted fw-bold fs-7 mb-2">Specimen Metadata</h6>
      <div class="mb-2">
        <label class="form-label small mb-1">Species Name</label>
        <input type="text" id="metaSpecies" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="e.g. Astyanax mexicanus">
      </div>
      <div class="mb-2">
        <label class="form-label small mb-1">Brood ID</label>
        <input type="text" id="metaBrood" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="e.g. B-2024-03">
      </div>
      <div class="mb-3">
        <label class="form-label small mb-1">Sex</label>
        <select id="metaSex" class="form-select form-select-sm bg-dark text-light border-secondary">
          <option value="">Unspecified</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Indeterminate">Indeterminate</option>
        </select>
      </div>

      <hr class="border-secondary my-2">

      <h6 class="text-uppercase text-muted fw-bold fs-7 mb-2">Annotation Modes</h6>
      <div class="d-grid gap-2 mb-3">
        <button id="btnPrecaudal" class="btn btn-mode active-pre text-start d-flex justify-content-between align-items-center" onclick="setMode('precaudal')">
          <span><i class="bi bi-record-circle-fill text-danger me-2"></i> Precaudal (1)</span>
          <span id="sideCountPre" class="badge bg-danger rounded-pill">0</span>
        </button>
        <button id="btnCaudal" class="btn btn-mode text-start d-flex justify-content-between align-items-center" onclick="setMode('caudal')">
          <span><i class="bi bi-record-circle-fill text-info me-2"></i> Caudal (2)</span>
          <span id="sideCountCau" class="badge bg-info rounded-pill">0</span>
        </button>
      </div>

      <h6 class="text-uppercase text-muted fw-bold fs-7 mb-2">Exclusion Rules</h6>
      <div class="form-check form-switch mb-1">
        <input class="form-check-input" type="checkbox" id="exWeberian" checked onchange="updateCounts()">
        <label class="form-check-label small" for="exWeberian">Exclude Weberian (V1-V4)</label>
      </div>
      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" id="exUrostyle" checked onchange="updateCounts()">
        <label class="form-check-label small" for="exUrostyle">Exclude Urostyle (U)</label>
      </div>

      <hr class="border-secondary my-2">

      <h6 class="text-uppercase text-muted fw-bold fs-7 mb-2">Export Options</h6>
      <div class="d-grid gap-2">
        <button class="btn btn-success btn-sm text-start" onclick="exportCSV()"><i class="bi bi-filetype-csv me-2"></i> Export CSV Table</button>
        <button class="btn btn-outline-light btn-sm text-start" onclick="exportPNG()"><i class="bi bi-file-earmark-image me-2 text-warning"></i> Export Annotated Image</button>
        <button class="btn btn-outline-danger btn-sm text-start" onclick="clearAll()"><i class="bi bi-trash me-2"></i> Clear Points</button>
      </div>
    </div>

    <div class="canvas-wrapper" id="canvasWrapper">
      <div id="bannerInstruction" class="banner-instruction">Click start point (head/anterior) of the spine</div>
      <canvas id="imageCanvas"></canvas>

      <div class="floating-controls">
        <button class="floating-btn" onclick="zoomIn()" title="Zoom In"><i class="bi bi-zoom-in"></i></button>
        <button class="floating-btn" onclick="zoomOut()" title="Zoom Out"><i class="bi bi-zoom-out"></i></button>
        <button class="floating-btn" onclick="resetView()" title="Reset View"><i class="bi bi-arrows-angle-contract"></i></button>
      </div>

      <div class="ai-dock">
        <div class="counter-badge">
          <span class="val val-pre" id="dockPreCount">0</span>
          <span class="lbl">Precaudal</span>
        </div>

        <div class="counter-badge">
          <span class="val val-cau" id="dockCauCount">0</span>
          <span class="lbl">Caudal</span>
        </div>

        <div class="counter-badge border-end border-secondary pe-3">
          <span class="val val-total" id="dockTotalCount">0</span>
          <span class="lbl">Total Count</span>
        </div>

        <div>
          <button class="btn btn-primary fw-bold" onclick="startSpinePlacement()"><i class="bi bi-geo-alt-fill me-1"></i> Set Spine Line Markers</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvasWrapper');

    let currentImage = null;
    let mode = 'precaudal';
    let points = [];

    let scale = 1;
    let panX = 0;
    let panY = 0;
    let isPanning = false;
    let startPanX = 0;
    let startPanY = 0;
    let isSpacePressed = false;

    // Spine Line Placement State
    let placementStep = 0; // 0: off, 1: click start, 2: click end
    let lineStart = null;

    function setMode(newMode) {
      mode = newMode;
      document.getElementById('btnPrecaudal').className = `btn btn-mode ${mode==='precaudal'?'active-pre':''} text-start d-flex justify-content-between align-items-center`;
      document.getElementById('btnCaudal').className = `btn btn-mode ${mode==='caudal'?'active-cau':''} text-start d-flex justify-content-between align-items-center`;
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          currentImage = img;
          points = [];
          resetView();
          updateCounts();
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function loadSampleImage() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 1000;
      tempCanvas.height = 500;
      const tctx = tempCanvas.getContext('2d');

      tctx.fillStyle = '#050508';
      tctx.fillRect(0, 0, 1000, 500);

      tctx.strokeStyle = '#88c0d0';
      tctx.lineWidth = 4;
      tctx.beginPath();
      tctx.moveTo(150, 250);
      tctx.lineTo(850, 250);
      tctx.stroke();

      for(let x = 160; x <= 840; x += 22) {
        tctx.fillStyle = '#ffffff';
        tctx.beginPath();
        tctx.arc(x, 250, 5, 0, Math.PI * 2);
        tctx.fill();
      }

      const img = new Image();
      img.onload = () => {
        currentImage = img;
        points = [];
        resetView();
        updateCounts();
      };
      img.src = tempCanvas.toDataURL();
    }

    function render() {
      if (!currentImage) return;

      canvas.width = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;

      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.translate(panX, panY);
      ctx.scale(scale, scale);

      ctx.drawImage(currentImage, 0, 0);

      let preIdx = 1;
      let cauIdx = 1;

      points.forEach((pt) => {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 6 / scale, 0, Math.PI * 2);
        if (pt.type === 'precaudal') {
          ctx.fillStyle = '#ff4d4d';
          ctx.strokeStyle = '#ffffff';
        } else {
          ctx.fillStyle = '#00f2fe';
          ctx.strokeStyle = '#ffffff';
        }
        ctx.lineWidth = 2 / scale;
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${Math.max(10, 12 / scale)}px sans-serif`;
        const labelText = pt.type === 'precaudal' ? `P${preIdx++}` : `C${cauIdx++}`;
        ctx.fillText(labelText, pt.x + (8 / scale), pt.y - (8 / scale));
      });

      ctx.restore();
    }

    function startSpinePlacement() {
      if (!currentImage) return alert('Please upload an image first.');
      placementStep = 1;
      const banner = document.getElementById('bannerInstruction');
      banner.innerText = 'Click anterior (head) end of spine';
      banner.style.display = 'block';
    }

    wrapper.addEventListener('click', (e) => {
      if (isPanning || !currentImage) return;
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left - panX) / scale;
      const clickY = (e.clientY - rect.top - panY) / scale;

      if (clickX < 0 || clickX > currentImage.width || clickY < 0 || clickY > currentImage.height) return;

      if (placementStep === 1) {
        lineStart = { x: clickX, y: clickY };
        placementStep = 2;
        const banner = document.getElementById('bannerInstruction');
        banner.innerText = 'Click posterior (tail) end of spine';
        return;
      }

      if (placementStep === 2) {
        const lineEnd = { x: clickX, y: clickY };
        placementStep = 0;
        document.getElementById('bannerInstruction').style.display = 'none';

        points = [];
        const numPre = 10;
        const numCau = 15;
        const total = numPre + numCau;

        for (let i = 0; i < total; i++) {
          const t = i / (total - 1);
          const px = lineStart.x + t * (lineEnd.x - lineStart.x);
          const py = lineStart.y + t * (lineEnd.y - lineStart.y);
          points.push({
            x: px,
            y: py,
            type: i < numPre ? 'precaudal' : 'caudal'
          });
        }
        updateCounts();
        render();
        return;
      }

      points.push({ x: clickX, y: clickY, type: mode });
      updateCounts();
      render();
    });

    wrapper.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
      scale = Math.min(Math.max(0.2, scale * zoomFactor), 15);
      render();
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
      if (e.key === '1') setMode('precaudal');
      if (e.key === '2') setMode('caudal');
      if (e.key === 'z' || e.key === 'Z') {
        points.pop();
        updateCounts();
        render();
      }
      if (e.code === 'Space') {
        isSpacePressed = true;
        wrapper.classList.add('panning');
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') {
        isSpacePressed = false;
        wrapper.classList.remove('panning');
      }
    });

    wrapper.addEventListener('mousedown', (e) => {
      if (isSpacePressed || e.button === 1) {
        isPanning = true;
        startPanX = e.clientX - panX;
        startPanY = e.clientY - panY;
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isPanning) {
        panX = e.clientX - startPanX;
        panY = e.clientY - startPanY;
        render();
      }
    });

    window.addEventListener('mouseup', () => { isPanning = false; });

    function resetView() {
      if (!currentImage) return;
      scale = Math.min(wrapper.clientWidth / currentImage.width, wrapper.clientHeight / currentImage.height) * 0.8;
      panX = (wrapper.clientWidth - currentImage.width * scale) / 2;
      panY = (wrapper.clientHeight - currentImage.height * scale) / 2;
      render();
    }

    function zoomIn() { scale *= 1.2; render(); }
    function zoomOut() { scale *= 0.8; render(); }

    function updateCounts() {
      const preCount = points.filter(p => p.type === 'precaudal').length;
      const cauCount = points.filter(p => p.type === 'caudal').length;

      document.getElementById('sideCountPre').innerText = preCount;
      document.getElementById('sideCountCau').innerText = cauCount;
      document.getElementById('dockPreCount').innerText = preCount;
      document.getElementById('dockCauCount').innerText = cauCount;

      const exW = document.getElementById('exWeberian').checked ? 4 : 0;
      const exU = document.getElementById('exUrostyle').checked ? 1 : 0;
      const adjustedTotal = Math.max(0, (preCount + cauCount) - exW - exU);

      document.getElementById('dockTotalCount').innerText = adjustedTotal;
    }

    function clearAll() {
      if (confirm('Clear all digitized points?')) {
        points = [];
        updateCounts();
        render();
      }
    }

    function exportCSV() {
      const species = (document.getElementById('metaSpecies').value || 'Unspecified').replace(/,/g, '');
      const brood = (document.getElementById('metaBrood').value || 'Unspecified').replace(/,/g, '');
      const sex = (document.getElementById('metaSex').value || 'Unspecified').replace(/,/g, '');

      const preCount = points.filter(p => p.type === 'precaudal').length;
      const cauCount = points.filter(p => p.type === 'caudal').length;
      const exW = document.getElementById('exWeberian').checked ? 4 : 0;
      const exU = document.getElementById('exUrostyle').checked ? 1 : 0;
      const totalCount = Math.max(0, (preCount + cauCount) - exW - exU);

      let csv = 'SPECIES NAME,BROOD ID,SEX,PRECADUAL COUNT,CADUAL COUNT,TOTAL COUNT\n';
      csv += `${species},${brood},${sex},${preCount},${cauCount},${totalCount}\n`;

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `fish_data_${brood || 'export'}.csv`;
      a.click();
    }

    function exportPNG() {
      if (!currentImage) return;
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = currentImage.width;
      exportCanvas.height = currentImage.height;
      const ectx = exportCanvas.getContext('2d');

      ectx.drawImage(currentImage, 0, 0);

      let preIdx = 1;
      let cauIdx = 1;

      points.forEach((pt) => {
        ectx.beginPath();
        ectx.arc(pt.x, pt.y, 8, 0, Math.PI * 2);
        ectx.fillStyle = pt.type === 'precaudal' ? '#ff4d4d' : '#00f2fe';
        ectx.strokeStyle = '#ffffff';
        ectx.lineWidth = 2;
        ectx.fill();
        ectx.stroke();

        ectx.fillStyle = '#ffffff';
        ectx.font = 'bold 16px sans-serif';
        const label = pt.type === 'precaudal' ? `P${preIdx++}` : `C${cauIdx++}`;
        ectx.fillText(label, pt.x + 10, pt.y - 10);
      });

      const a = document.createElement('a');
      a.href = exportCanvas.toDataURL('image/png');
      a.download = 'annotated_vertebrae.png';
      a.click();
    }

    window.onload = () => {
      loadSampleImage();
    };
  </script>
</body>
</html>
